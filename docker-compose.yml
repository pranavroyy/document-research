services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_research_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_research
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: ai_research_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ai_research
      OLLAMA_MODEL: llama3.2:3b
      OLLAMA_HOST: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: ai_research_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: